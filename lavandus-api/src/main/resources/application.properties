spring.application.name=lavandus
spring.datasource.url=jdbc:postgresql://localhost:5432/lavandus_db
spring.datasource.username=lavandus_user
spring.datasource.password=lavandus123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Ejecuta data.sql (seed) también contra Postgres y DESPUÉS de que Hibernate cree/actualice las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Correo (LDUS-54) ---
# Sin credenciales en el repo: se configuran por variables de entorno.
# Si MAIL_HOST queda vacío, el envío no se intenta y la factura queda NO_ENVIADA.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Facturas: carpeta donde se guardan los PDF, remitente y dominio de correo permitido.
lavandus.facturas.dir=${FACTURAS_DIR:uploads/facturas}
lavandus.facturas.remitente=${MAIL_FROM:facturacion@lavandus.com}
lavandus.facturas.dominio-permitido=copytosh.com
